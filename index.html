
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lộ Trình Tuyến MPE - Cấp Quản Trị</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Hàm tính khoảng cách đường chim bay (Haversine formula)
        const getDistanceFromLatLonInKm = (lat1, lon1, lat2, lon2) => {
            const R = 6371; // Bán kính trái đất (km)
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return (R * c).toFixed(1);
        };

        function App() {
            const [customers, setCustomers] = useState([]);
            const [homeLocation, setHomeLocation] = useState(null); // Tọa độ nhà
            
            const currentObjDate = new Date();
            const [selectedMonth, setSelectedMonth] = useState(currentObjDate.getMonth() + 1);
            const [selectedYear, setSelectedYear] = useState(currentObjDate.getFullYear());
            const [activeWeekTab, setActiveWeekTab] = useState(1);
            const [fullMonthSchedule, setFullMonthSchedule] = useState(null); 
            
            const [activeTab, setActiveTab] = useState('upload'); 
            const [status, setStatus] = useState({ type: 'loading', text: 'Đang khởi động hệ thống...' });
            const [librariesReady, setLibrariesReady] = useState(false);
            const [duplicateCount, setDuplicateCount] = useState(0);
            const [hasSavedData, setHasSavedData] = useState(false);
            const fileInputRef = useRef(null);

            // 1. KHỞI TẠO THƯ VIỆN & KIỂM TRA BỘ NHỚ LƯU TRỮ
            useEffect(() => {
                const loadScript = (src) => new Promise((resolve, reject) => {
                    if (document.querySelector(`script[src="${src}"]`)) return resolve();
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });

                Promise.all([
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js")
                ]).then(() => {
                    setLibrariesReady(true);
                    window.localforage.getItem('mpe_routing_data_pro').then(data => {
                        if(data && data.customers && data.customers.length > 0) {
                            setHasSavedData(true);
                            setStatus({ type: 'success', text: 'Phát hiện phiên làm việc cũ.' });
                        } else {
                            setStatus({ type: 'success', text: 'Hệ thống đã sẵn sàng.' });
                        }
                    });
                }).catch(() => {
                    setStatus({ type: 'error', text: 'Lỗi tải thư viện. Vui lòng kiểm tra mạng.' });
                });
            }, []);

            // AUTO-SAVE: TỰ ĐỘNG LƯU DỮ LIỆU
            useEffect(() => {
                if (librariesReady && customers.length > 0) {
                    window.localforage.setItem('mpe_routing_data_pro', {
                        customers,
                        fullMonthSchedule,
                        selectedMonth,
                        selectedYear,
                        homeLocation
                    });
                    setHasSavedData(true);
                }
            }, [customers, fullMonthSchedule, selectedMonth, selectedYear, homeLocation, librariesReady]);

            // HÀM KHÔI PHỤC DỮ LIỆU
            const restoreData = () => {
                setStatus({ type: 'loading', text: 'Đang khôi phục dữ liệu...' });
                window.localforage.getItem('mpe_routing_data_pro').then(data => {
                    if(data) {
                        setCustomers(data.customers || []);
                        setFullMonthSchedule(data.fullMonthSchedule || null);
                        setSelectedMonth(data.selectedMonth || selectedMonth);
                        setSelectedYear(data.selectedYear || selectedYear);
                        setHomeLocation(data.homeLocation || null);
                        
                        setActiveTab(data.fullMonthSchedule ? 'schedule' : 'categorize');
                        setStatus({ type: 'success', text: 'Đã khôi phục thành công!' });
                    }
                });
            };

            // HÀM XÓA DỮ LIỆU CŨ ĐỂ LÀM MỚI
            const clearDataAndNew = () => {
                window.localforage.removeItem('mpe_routing_data_pro');
                setHasSavedData(false);
                setCustomers([]);
                setFullMonthSchedule(null);
                setHomeLocation(null);
                if (fileInputRef.current) fileInputRef.current.click();
            };

            // 2. NẠP FILE (GIỮ LẠI ĐỊNH VỊ CŨ NẾU TRÙNG TÊN)
            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (!librariesReady || !window.XLSX) return setStatus({ type: 'error', text: 'Thư viện chưa sẵn sàng.' });

                setStatus({ type: 'loading', text: 'Đang xử lý file Excel...' });
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = window.XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        processThuanExcel(jsonData);
                    } catch (err) {
                        setStatus({ type: 'error', text: 'Lỗi định dạng file: ' + err.message });
                    }
                };
                reader.onerror = () => setStatus({ type: 'error', text: 'Lỗi khi đọc file.' });
                reader.readAsArrayBuffer(file);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const processThuanExcel = (data) => {
                const parsedData = [];
                const seenNames = new Set();
                let idCounter = 1;
                let duplicates = 0;
                const oldCustomers = [...customers]; // Dùng để bảo toàn định vị cũ

                const cleanForDuplicateCheck = (name) => {
                    if (!name) return ""; 
                    return String(name).toLowerCase().replace(/\s+/g, '');
                };

                const addCustomer = (name, phone, xa, huyen) => {
                    if (!name) return; 
                    const normalizedCheck = cleanForDuplicateCheck(name);
                    if (seenNames.has(normalizedCheck)) {
                        duplicates++; return;
                    }
                    seenNames.add(normalizedCheck);
                    
                    // Tìm xem khách này trước đó đã có định vị chưa
                    const existingCust = oldCustomers.find(c => cleanForDuplicateCheck(c.name) === normalizedCheck);

                    parsedData.push({
                        id: `MT1_${Date.now()}_${idCounter++}`, 
                        name: String(name),
                        phone: phone ? String(phone) : '',
                        xa: xa ? String(xa) : 'CHƯA RÕ',
                        huyen: huyen ? String(huyen) : 'CHƯA RÕ',
                        type: existingCust ? existingCust.type : 'DUY_TRI', 
                        subGroup: idCounter % 2 === 0 ? 2 : 1,
                        location: existingCust ? existingCust.location : null // Bảo toàn định vị
                    });
                };

                for (let i = 0; i < data.length; i++) {
                    if (!Array.isArray(data[i])) continue; 

                    const row = data[i].map(cell => cell ? cell.toString().trim() : '');
                    const stt1 = row[0]; const name1 = row[1];
                    if (stt1 && !isNaN(stt1) && name1 && name1 !== 'TÊN KHÁCH HÀNG') {
                        addCustomer(name1, row[2], row[3], row[4]);
                    }
                    let rightIdx = -1;
                    for (let c = 4; c < 10; c++) {
                        if (row[c] && !isNaN(row[c]) && row[c+1] && row[c+1] !== 'TÊN KHÁCH HÀNG') { rightIdx = c; break; }
                    }
                    if (rightIdx !== -1) {
                        addCustomer(row[rightIdx + 1], row[rightIdx + 2], row[rightIdx + 3], row[rightIdx + 4]);
                    }
                }

                if (parsedData.length === 0) return setStatus({ type: 'error', text: 'Không trích xuất được dữ liệu.' });

                setCustomers(parsedData);
                setDuplicateCount(duplicates);
                setActiveTab('categorize');
                setStatus({ type: 'success', text: `Đã nạp ${parsedData.length} KH. Loại bỏ ${duplicates} KH trùng lặp.` });
                setFullMonthSchedule(null);
            };

            const toggleType = (id) => {
                setCustomers(prev => prev.map(c => c.id === id ? { ...c, type: c.type === 'TRONG_DIEM' ? 'DUY_TRI' : 'TRONG_DIEM' } : c));
                setFullMonthSchedule(null);
            };

            // ---------------- TÍNH NĂNG ĐỊNH VỊ (GPS) ----------------
            const handleSetHomeLocation = () => {
                if (!navigator.geolocation) return setStatus({ type: 'error', text: 'Trình duyệt không hỗ trợ định vị.' });
                setStatus({ type: 'loading', text: 'Đang lấy tọa độ nhà...' });
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        setHomeLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude });
                        setStatus({ type: 'success', text: 'Đã lưu Điểm Xuất Phát!' });
                    },
                    (err) => setStatus({ type: 'error', text: 'Vui lòng cấp quyền Vị Trí (Location) cho trình duyệt.' }),
                    { enableHighAccuracy: true }
                );
            };

            const handleSetCustomerLocation = (id) => {
                if (!navigator.geolocation) return setStatus({ type: 'error', text: 'Trình duyệt không hỗ trợ định vị.' });
                setStatus({ type: 'loading', text: 'Đang lấy tọa độ cửa hàng...' });
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        setCustomers(prev => prev.map(c => c.id === id ? { ...c, location: { lat: pos.coords.latitude, lng: pos.coords.longitude } } : c));
                        setStatus({ type: 'success', text: 'Đã lưu định vị cửa hàng!' });
                    },
                    (err) => setStatus({ type: 'error', text: 'Vui lòng cấp quyền Vị Trí (Location) cho trình duyệt.' }),
                    { enableHighAccuracy: true }
                );
            };

            const handleRemoveCustomerLocation = (id) => {
                setCustomers(prev => prev.map(c => c.id === id ? { ...c, location: null } : c));
            };

            const getCustomerLocation = (id) => customers.find(c => c.id === id)?.location;

            // ---------------- TÍNH NĂNG DOANH SỐ & LỘ TRÌNH ----------------
            const handleSalesChange = (week, day, customerId, salesValue) => {
                const newSchedule = { ...fullMonthSchedule };
                const dayItems = newSchedule[week][day].items;
                const itemIndex = dayItems.findIndex(i => i.id === customerId);
                if (itemIndex > -1) {
                    dayItems[itemIndex].sales = salesValue;
                }
                setFullMonthSchedule(newSchedule);
            };

            const handleOptimizeRoute = (week, day) => {
                if (!homeLocation) {
                    setStatus({ type: 'error', text: 'Vui lòng thiết lập Vị trí Nhà trước khi tối ưu.' });
                    return;
                }
                
                const newSchedule = { ...fullMonthSchedule };
                const dayItems = [...newSchedule[week][day].items];
                
                if (dayItems.length <= 1) return;

                setStatus({ type: 'loading', text: 'Đang tối ưu lộ trình...' });
                
                setTimeout(() => {
                    let currentLoc = homeLocation;
                    const optimized = [];
                    const unlocated = []; 
                    
                    // Tách khách có định vị và chưa có
                    dayItems.forEach(item => {
                        const loc = getCustomerLocation(item.id);
                        if (loc) optimized.push({ ...item, _loc: loc });
                        else unlocated.push(item);
                    });

                    // Thuật toán: Điểm gần nhất tiếp theo
                    const finalOptimized = [];
                    while (optimized.length > 0) {
                        optimized.sort((a, b) => {
                            const distA = getDistanceFromLatLonInKm(currentLoc.lat, currentLoc.lng, a._loc.lat, a._loc.lng);
                            const distB = getDistanceFromLatLonInKm(currentLoc.lat, currentLoc.lng, b._loc.lat, b._loc.lng);
                            return distA - distB;
                        });
                        const nearest = optimized.shift();
                        finalOptimized.push(nearest);
                        currentLoc = nearest._loc; // Cập nhật vị trí hiện tại
                    }
                    
                    finalOptimized.forEach(item => delete item._loc);

                    // Ghép lại: Khách có lộ trình đi trước, chưa có đi sau
                    newSchedule[week][day].items = [...finalOptimized, ...unlocated];
                    setFullMonthSchedule(newSchedule);
                    setStatus({ type: 'success', text: `Đã tự động tối ưu tuyến ${newSchedule[week][day].day}!` });
                }, 300);
            };

            const trongDiemCount = customers.filter(c => c.type === 'TRONG_DIEM').length;
            const duyTriCount = customers.length - trongDiemCount;

            const geoStats = {};
            customers.forEach(c => {
                const h = c.huyen || 'Khác';
                geoStats[h] = (geoStats[h] || 0) + 1;
            });
            const geoArr = Object.entries(geoStats).sort((a,b) => b[1] - a[1]);

            // 4. THUẬT TOÁN XẾP TUYẾN
            const buildSingleWeek = (isOddWeek) => {
                const activeSubGroup = isOddWeek ? 1 : 2;
                const activeCustomers = customers.filter(c => c.type === 'TRONG_DIEM' || c.subGroup === activeSubGroup).map(c => ({...c, sales: ''}));
                
                const normalize = (str) => str ? str.toLowerCase().replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,"a").replace(/[èéẹẻẽêềếệểễ]/g,"e").replace(/[ìíịỉĩ]/g,"i").replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,"o").replace(/[ùúụủũưừứựửữ]/g,"u").replace(/[ỳýỵỷỹ]/g,"y").replace(/đ/g,"d").trim() : "";

                const grouped = { 'Cái Bè': [], 'Cai Lậy': [], 'Tân Phước': [], 'Châu Thành': [], 'Mỹ Tho': [], 'Khác': [] };
                activeCustomers.forEach(c => {
                    const h = normalize(c.huyen);
                    if (h.includes('be')) grouped['Cái Bè'].push(c);
                    else if (h.includes('lay')) grouped['Cai Lậy'].push(c);
                    else if (h.includes('phuoc')) grouped['Tân Phước'].push(c);
                    else if (h.includes('chau') || h.includes('thanh')) grouped['Châu Thành'].push(c);
                    else if (h.includes('tho')) grouped['Mỹ Tho'].push(c);
                    else grouped['Khác'].push(c);
                });

                const pull = (arr, count) => arr.splice(0, count);

                const weekSchedule = {
                    T2: { day: 'Thứ 2', desc: 'Triển khai tuyến Cai Lậy / Tân Phước', location: 'Cai Lậy / Tân Phước', limit: 12, items: [] },
                    T3: { day: 'Thứ 3', desc: 'Trọng điểm Cái Bè (Thúc đẩy doanh số)', location: 'Cái Bè', limit: 12, items: [] },
                    T4: { day: 'Thứ 4', desc: 'Triển khai tuyến Châu Thành / Mỹ Tho', location: 'Châu Thành / Mỹ Tho', limit: 12, items: [] },
                    T5: { day: 'Thứ 5', desc: 'Triển khai tuyến Cai Lậy / Tân Phước', location: 'Cai Lậy / Tân Phước', limit: 12, items: [] },
                    T6: { day: 'Thứ 6', desc: 'Trọng điểm Cái Bè (Thúc đẩy doanh số)', location: 'Cái Bè / Cai Lậy', limit: 12, items: [] },
                    T7: { day: 'Thứ 7', desc: 'Bảo trì tuyến Mỹ Tho / Châu Thành', location: 'Mỹ Tho / Châu Thành', limit: 10, items: [] },
                };

                weekSchedule.T3.items.push(...pull(grouped['Cái Bè'], 11));
                if(weekSchedule.T3.items.length < 10) weekSchedule.T3.items.push(...pull(grouped['Cai Lậy'], 10 - weekSchedule.T3.items.length));
                
                weekSchedule.T6.items.push(...pull(grouped['Cái Bè'], 11));
                if(weekSchedule.T6.items.length < 10) weekSchedule.T6.items.push(...pull(grouped['Cai Lậy'], 10 - weekSchedule.T6.items.length));

                weekSchedule.T2.items.push(...pull(grouped['Cai Lậy'], 7));
                weekSchedule.T2.items.push(...pull(grouped['Tân Phước'], 4));

                weekSchedule.T5.items.push(...pull(grouped['Cai Lậy'], 7));
                weekSchedule.T5.items.push(...pull(grouped['Tân Phước'], 4));

                weekSchedule.T4.items.push(...pull(grouped['Châu Thành'], 7));
                weekSchedule.T4.items.push(...pull(grouped['Mỹ Tho'], 4));

                weekSchedule.T7.items.push(...pull(grouped['Mỹ Tho'], 6));
                weekSchedule.T7.items.push(...pull(grouped['Châu Thành'], 4));

                const leftovers = [...grouped['Mỹ Tho'], ...grouped['Châu Thành'], ...grouped['Tân Phước'], ...grouped['Cai Lậy'], ...grouped['Cái Bè'], ...grouped['Khác']];
                const days = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
                let dayIdx = 0;
                
                while (leftovers.length > 0) {
                    let placed = false;
                    for (let i = 0; i < days.length; i++) {
                        const d = days[(dayIdx + i) % days.length];
                        if (weekSchedule[d].items.length < weekSchedule[d].limit) {
                            weekSchedule[d].items.push(leftovers.shift());
                            placed = true;
                            dayIdx = (dayIdx + i + 1) % days.length;
                            break;
                        }
                    }
                    if (!placed && leftovers.length > 0) {
                        let minDay = days[0];
                        for (let d of days) {
                            if (weekSchedule[d].items.length < weekSchedule[minDay].items.length) {
                                minDay = d;
                            }
                        }
                        weekSchedule[minDay].items.push(leftovers.shift());
                    }
                }
                return weekSchedule;
            };

            const executeRoutingForMonth = () => {
                setStatus({ type: 'loading', text: 'Đang tổng hợp lộ trình cả tháng...' });
                setTimeout(() => {
                    const monthPlan = {
                        1: buildSingleWeek(true),
                        2: buildSingleWeek(false),
                        3: buildSingleWeek(true),
                        4: buildSingleWeek(false)
                    };
                    setFullMonthSchedule(monthPlan);
                    setActiveTab('schedule');
                    setActiveWeekTab(1);
                    setStatus({ type: 'success', text: `Đã tạo lộ trình Tháng ${selectedMonth}/${selectedYear} thành công.` });
                }, 500);
            };

            // 5. KẾT XUẤT BÁO CÁO EXCEL & GỬI QUA ZALO
            const exportToExcelReal = async () => {
                if (!fullMonthSchedule || !window.ExcelJS) return setStatus({ type: 'error', text: 'Lỗi thư viện xuất Excel.' });

                setStatus({ type: 'loading', text: 'Đang kết xuất báo cáo Quản trị (.xlsx)...' });
                
                try {
                    const wb = new window.ExcelJS.Workbook();
                    wb.creator = 'MPE Routing System';
                    const currentQuarter = Math.ceil(selectedMonth / 3);

                    const wsDash = wb.addWorksheet('Tổng Quan Tháng');
                    wsDash.columns = [{ width: 3 }, { width: 35 }, { width: 20 }, { width: 30 }, { width: 25 }];

                    wsDash.mergeCells('B2:E2');
                    const titleCell = wsDash.getCell('B2');
                    titleCell.value = `PHÂN TÍCH ĐỊA BÀN & LỊCH TUYẾN - THÁNG ${selectedMonth}/${selectedYear}`;
                    titleCell.font = { size: 14, bold: true, color: { argb: 'FF0047AB' } };
                    titleCell.alignment = { horizontal: 'center', vertical: 'middle' };

                    wsDash.mergeCells('B4:E4');
                    wsDash.getCell('B4').value = '1. CẤU TRÚC KHÁCH HÀNG (Cố định toàn tháng)';
                    wsDash.getCell('B4').font = { bold: true };

                    wsDash.addRow(['', 'Nhóm Khách Hàng', 'Số Lượng', 'Ghi Chú', '']);
                    wsDash.lastRow.eachCell((c, i) => {
                        if(i>1 && i<5) { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0047AB' } }; c.font = { color: { argb: 'FFFFFFFF' }, bold: true }; c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} }; }
                    });

                    const addRowDash = (col2, col3, col4, col5 = '') => {
                        wsDash.addRow(['', col2, col3, col4, col5]);
                        const r = wsDash.lastRow;
                        [2,3,4,5].forEach(i => r.getCell(i).border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} });
                        return r;
                    };

                    addRowDash('Khách Trọng Điểm', trongDiemCount, 'Thăm viếng mỗi tuần (4 lần/tháng)', '');
                    addRowDash('Khách Duy Trì', duyTriCount, 'Xoay vòng luân phiên (2 lần/tháng)', '');
                    wsDash.addRow([]); 

                    wsDash.mergeCells(`B${wsDash.rowCount + 1}:E${wsDash.rowCount + 1}`);
                    wsDash.lastRow.getCell(2).value = '2. TỔNG HỢP KIỂM SOÁT KPI & DOANH SỐ THỰC TẾ';
                    wsDash.lastRow.getCell(2).font = { bold: true };

                    wsDash.addRow(['', 'Tuần', 'Tổng Cửa Hàng Check-in', 'Đánh Giá KPI', 'Tổng Doanh Số (VNĐ)']);
                    wsDash.lastRow.eachCell((c, i) => {
                        if(i>1) { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE36C09' } }; c.font = { color: { argb: 'FFFFFFFF' }, bold: true }; c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} }; }
                    });

                    let totalActiveMonth = 0;
                    let totalSalesMonth = 0;

                    [1, 2, 3, 4].forEach(weekNum => {
                        let weekTotal = 0;
                        let weekSales = 0;
                        Object.keys(fullMonthSchedule[weekNum]).forEach(day => {
                            fullMonthSchedule[weekNum][day].items.forEach(item => {
                                weekTotal++;
                                if (item.sales && !isNaN(item.sales)) weekSales += Number(item.sales);
                            });
                        });
                        totalActiveMonth += weekTotal;
                        totalSalesMonth += weekSales;
                        
                        let evalText = 'Đạt Chuẩn'; let evalColor = 'FF008000';
                        if (weekTotal < 48) { evalText = 'Chưa Tối Ưu (Dưới KPI)'; evalColor = 'FFFF0000'; }
                        
                        const r = addRowDash(`Tuần ${weekNum}`, weekTotal, evalText, weekSales);
                        r.getCell(4).font = { bold: true, color: { argb: evalColor } };
                        r.getCell(5).numFmt = '#,##0';

                                                <div className="p-3 flex-grow overflow-y-auto max-h-[450px] bg-slate-50/50 custom-scrollbar relative">
                                                    {count === 0 ? (
                                                        <div className="text-center text-slate-400 text-sm py-8 font-medium">Lịch chưa phân bổ.</div>
                                                    ) : (
                                                        <ul className="space-y-3 pb-6">
                                                            {data.items.map((c, index) => {
                                                                const loc = getCustomerLocation(c.id);
                                                                const distance = loc && homeLocation ? getDistanceFromLatLonInKm(homeLocation.lat, homeLocation.lng, loc.lat, loc.lng) : '--';
                                                                
                                                                return (
                                                                <li key={c.id} className="bg-white p-3.5 rounded-xl border border-slate-200 flex flex-col gap-2.5 shadow-sm hover:border-blue-300 transition-colors relative">
                                                                    <div className="absolute -left-2 -top-2 bg-slate-800 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold shadow">{index + 1}</div>
                                                                    <div className="flex justify-between items-start ml-2">
                                                                        <div className="flex-1 min-w-0">
                                                                            <div className="font-bold text-slate-800 text-[14px] truncate">{c.name}</div>
                                                                            <div className="text-[11px] text-slate-500 mt-0.5 font-medium">{c.xa}, {c.huyen}</div>
                                                                        </div>
                                                                        <span className={`shrink-0 text-[9px] uppercase font-bold px-1.5 py-0.5 rounded border ${c.type === 'TRONG_DIEM' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>
                                                                            {c.type === 'TRONG_DIEM' ? 'Trọng điểm' : 'Duy trì'}
                                                                        </span>
                                                                    </div>

                                                                    <div className="flex flex-col gap-2 border-t border-slate-100 pt-2 ml-2">
                                                                        {/* Doanh số */}
                                                                        <div className="flex items-center gap-2">
                                                                            <i className="fa-solid fa-sack-dollar text-green-600 w-4 text-center"></i>
                                                                            <input 
                                                                                type="number" 
                                                                                placeholder="Nhập doanh số bán (VNĐ)..." 
                                                                                value={c.sales || ''} 
                                                                                onChange={(e) => handleSalesChange(activeWeekTab, key, c.id, e.target.value)}
                                                                                className="text-xs font-bold text-green-700 border border-slate-200 bg-slate-50 rounded px-2 py-1.5 flex-1 outline-none focus:border-green-500 focus:bg-white transition"
                                                                            />
                                                                        </div>

                                                                        {/* GPS */}
                                                                        <div className="flex items-center justify-between mt-1">
                                                                            <div className="flex items-center gap-2 text-xs">
                                                                                <i className="fa-solid fa-map-location-dot text-orange-500 w-4 text-center"></i>
                                                                                {loc ? (
                                                                                    <span className="text-slate-600 font-medium text-[11px]">
                                                                                        Cách nhà: <span className="text-orange-600 font-bold">{distance} km</span>
                                                                                    </span>
                                                                                ) : (
                                                                                    <span className="text-slate-400 italic text-[11px]">Chưa có tọa độ</span>
                                                                                )}
                                                                            </div>
                                                                            <div className="flex gap-1.5">
                                                                                <button onClick={() => handleSetCustomerLocation(c.id)} className="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border border-slate-200 font-bold transition">
                                                                                    {loc ? 'Cập nhật' : 'Định vị GPS'}
                                                                                </button>
                                                                                {loc && (
                                                                                    <button onClick={() => handleRemoveCustomerLocation(c.id)} className="text-[10px] bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded border border-red-100 font-bold transition">
                                                                                        Xóa
                                                                                    </button>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </li>
                                                                );
                                                            })}
                                                        </ul>
                                                    )}
                                                    
                                                    {(key === 'T4' || key === 'T7') && (
                                                        <div className="mt-2 bg-blue-50/50 border border-blue-200 border-dashed rounded-lg p-3 flex items-center justify-center gap-2 text-blue-700 text-xs font-bold uppercase tracking-wider">
                                                            <i className="fa-solid fa-location-arrow text-[14px]"></i> Công tác phát triển thị trường
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                    <style dangerouslySetInnerHTML={{__html: `
                        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
                        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
                        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
                        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
                        /* Xóa mũi tên số lượng của input type=number */
                        input[type=number]::-webkit-inner-spin-button, 
                        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
                    `}} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
