
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Chăm Sóc Khách Hàng</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const getDistanceFromLatLonInKm = (lat1, lon1, lat2, lon2) => {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return (R * c).toFixed(1);
        };

        const formatVND = (amount) => {
            return new Intl.NumberFormat('vi-VN').format(amount || 0);
        };

        function App() {
            const [customers, setCustomers] = useState([]);
            const [homeLocation, setHomeLocation] = useState(null); 
            const [searchTerm, setSearchTerm] = useState(''); 
            
            const currentObjDate = new Date();
            const [selectedMonth, setSelectedMonth] = useState(currentObjDate.getMonth() + 1);
            const [selectedYear, setSelectedYear] = useState(currentObjDate.getFullYear());
            const [activeWeekTab, setActiveWeekTab] = useState(1);
            const [fullMonthSchedule, setFullMonthSchedule] = useState(null); 
            
            const [targetQuarter, setTargetQuarter] = useState(600000000);
            const [targetYear, setTargetYear] = useState(2400000000);

            const [activeTab, setActiveTab] = useState('upload'); 
            const [status, setStatus] = useState({ type: 'loading', text: 'Đang khởi động hệ thống...' });
            const [librariesReady, setLibrariesReady] = useState(false);
            const [duplicateCount, setDuplicateCount] = useState(0);
            const [hasSavedData, setHasSavedData] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const loadScript = (src) => new Promise((resolve, reject) => {
                    if (document.querySelector(`script[src="${src}"]`)) return resolve();
                    const script = document.createElement('script');
                    script.src = src; script.onload = resolve; script.onerror = reject;
                    document.head.appendChild(script);
                });

                Promise.all([
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"),
                    loadScript("https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js")
                ]).then(() => {
                    setLibrariesReady(true);
                    window.localforage.getItem('mpe_routing_data_pro').then(data => {
                        if(data && data.customers && data.customers.length > 0) {
                            setHasSavedData(true);
                            setStatus({ type: 'success', text: 'Phát hiện phiên làm việc cũ.' });
                        } else {
                            setStatus({ type: 'success', text: 'Hệ thống đã sẵn sàng.' });
                        }
                    });
                }).catch(() => setStatus({ type: 'error', text: 'Lỗi tải thư viện. Vui lòng kiểm tra mạng.' }));
            }, []);

            useEffect(() => {
                if (librariesReady && customers.length > 0) {
                    const timeoutId = setTimeout(() => {
                        window.localforage.setItem('mpe_routing_data_pro', {
                            customers, fullMonthSchedule, selectedMonth, selectedYear, homeLocation, targetQuarter, targetYear
                        });
                        setHasSavedData(true);
                    }, 500);
                    return () => clearTimeout(timeoutId);
                }
            }, [customers, fullMonthSchedule, selectedMonth, selectedYear, homeLocation, targetQuarter, targetYear, librariesReady]);

            const restoreData = () => {
                setStatus({ type: 'loading', text: 'Đang khôi phục dữ liệu...' });
                window.localforage.getItem('mpe_routing_data_pro').then(data => {
                    if(data) {
                        setCustomers(data.customers || []);
                        setFullMonthSchedule(data.fullMonthSchedule || null);
                        setSelectedMonth(data.selectedMonth || selectedMonth);
                        setSelectedYear(data.selectedYear || selectedYear);
                        setHomeLocation(data.homeLocation || null);
                        if(data.targetQuarter) setTargetQuarter(data.targetQuarter);
                        if(data.targetYear) setTargetYear(data.targetYear);
                        
                        setActiveTab(data.fullMonthSchedule ? 'schedule' : 'categorize');
                        setStatus({ type: 'success', text: 'Đã khôi phục thành công!' });
                    }
                });
            };

            const clearDataAndNew = () => {
                window.localforage.removeItem('mpe_routing_data_pro');
                setHasSavedData(false); setCustomers([]); setFullMonthSchedule(null); setHomeLocation(null);
                if (fileInputRef.current) fileInputRef.current.click();
            };

            const goBack = () => {
                setSearchTerm('');
                if (activeTab === 'schedule') setActiveTab('analysis');
                else if (activeTab === 'analysis') setActiveTab('categorize');
                else if (activeTab === 'categorize') setActiveTab('upload');
            };

            const handleFileUpload = async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                if (!librariesReady || !window.XLSX) return setStatus({ type: 'error', text: 'Thư viện chưa sẵn sàng.' });

                setStatus({ type: 'loading', text: 'Đang xử lý...' });
                
                let allData = [];
                try {
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const buffer = await file.arrayBuffer();
                        const workbook = window.XLSX.read(buffer, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        allData = allData.concat(jsonData);
                    }
                    processAndMergeExcel(allData);
                } catch (err) {
                    setStatus({ type: 'error', text: 'Lỗi định dạng file: ' + err.message });
                }
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const processAndMergeExcel = (data) => {
                const customerMap = new Map();
                let idCounter = 1;
                let duplicates = 0;
                const oldCustomers = [...customers];

                const cleanName = (name) => String(name).toLowerCase().replace(/\s+/g, '').trim();

                const isCustomerRow = (row) => {
                    if (!row || row.length < 2) return false;
                    const stt = String(row[0]).trim();
                    const name = String(row[1]).trim();
                    const invalidWords = ['TÊN KHÁCH HÀNG', 'DOANH SỐ', 'BẢNG THEO DÕI', 'NVKD', 'CHỈ TIÊU'];
                    if (stt && !isNaN(stt) && name) return !invalidWords.some(w => name.toUpperCase().includes(w));
                    return false;
                };

                for (let i = 0; i < data.length; i++) {
                    const row = data[i].map(cell => cell ? cell.toString().trim() : '');
                    if (isCustomerRow(row)) {
                        const name = row[1]; const phone = row[2] || ''; const xa = row[3] || 'CHƯA RÕ'; const huyen = row[4] || 'CHƯA RÕ';
                        const key = cleanName(name);

                        if (customerMap.has(key)) {
                            duplicates++;
                            const existing = customerMap.get(key);
                            if (!existing.phone && phone) existing.phone = phone;
                            if (existing.xa === 'CHƯA RÕ' && xa) existing.xa = xa;
                            if (existing.huyen === 'CHƯA RÕ' && huyen) existing.huyen = huyen;
                        } else {
                            const existingOld = oldCustomers.find(c => cleanName(c.name) === key);
                            customerMap.set(key, {
                                id: `MT1_${Date.now()}_${idCounter++}`, name: String(name), phone: phone, xa: xa, huyen: huyen,
                                type: existingOld ? existingOld.type : 'DUY_TRI', subGroup: idCounter % 2 === 0 ? 2 : 1,
                                location: existingOld ? existingOld.location : null
                            });
                        }
                    }
                }

                const finalParsed = Array.from(customerMap.values());
                if (finalParsed.length === 0) return setStatus({ type: 'error', text: 'Không trích xuất được KH nào.' });

                setCustomers(finalParsed);
                setDuplicateCount(duplicates);
                setActiveTab('categorize');
                setStatus({ type: 'success', text: `Nạp thành công ${finalParsed.length} KH chuẩn. Gộp ${duplicates} dữ liệu trùng.` });
                setFullMonthSchedule(null);
            };

            const toggleType = (id) => {
                setCustomers(prev => prev.map(c => c.id === id ? { ...c, type: c.type === 'TRONG_DIEM' ? 'DUY_TRI' : 'TRONG_DIEM' } : c));
                setFullMonthSchedule(null);
            };

            const handleSetHomeLocation = () => {
                if (!navigator.geolocation) return setStatus({ type: 'error', text: 'Trình duyệt không hỗ trợ định vị.' });
                setStatus({ type: 'loading', text: 'Đang lấy tọa độ...' });
                navigator.geolocation.getCurrentPosition(
                    (pos) => { setHomeLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude }); setStatus({ type: 'success', text: 'Đã lưu Vị trí!' }); },
                    (err) => setStatus({ type: 'error', text: 'Vui lòng cấp quyền Vị Trí.' }), { enableHighAccuracy: true }
                );
            };

            const handleSetCustomerLocation = (id) => {
                if (!navigator.geolocation) return setStatus({ type: 'error', text: 'Trình duyệt không hỗ trợ định vị.' });
                setStatus({ type: 'loading', text: 'Đang lấy tọa độ...' });
                navigator.geolocation.getCurrentPosition(
                    (pos) => { setCustomers(prev => prev.map(c => c.id === id ? { ...c, location: { lat: pos.coords.latitude, lng: pos.coords.longitude } } : c)); setStatus({ type: 'success', text: 'Đã lưu tọa độ!' }); },
                    (err) => setStatus({ type: 'error', text: 'Vui lòng cấp quyền Vị Trí.' }), { enableHighAccuracy: true }
                );
            };

            const handleRemoveCustomerLocation = (id) => setCustomers(prev => prev.map(c => c.id === id ? { ...c, location: null } : c));
            const getCustomerLocation = (id) => customers.find(c => c.id === id)?.location;

            // FIX LAG: Tối ưu state update bằng functional update không clone toàn bộ object
            const handleSalesChange = useCallback((week, day, customerId, salesValue) => {
                setFullMonthSchedule(prev => {
                    const updatedWeekDayItems = prev[week][day].items.map(item => 
                        item.id === customerId ? { ...item, sales: salesValue } : item
                    );
                    return {
                        ...prev,
                        [week]: {
                            ...prev[week],
                            [day]: { ...prev[week][day], items: updatedWeekDayItems }
                        }
                    };
                });
            }, []);

            const handleOptimizeRoute = (week, day) => {
                if (!homeLocation) return setStatus({ type: 'error', text: 'Vui lòng thiết lập Vị trí Nhà trước.' });
                const newSchedule = { ...fullMonthSchedule };
                const dayItems = [...newSchedule[week][day].items];
                if (dayItems.length <= 1) return;

                setStatus({ type: 'loading', text: 'Đang tối ưu lộ trình...' });
                setTimeout(() => {
                    let currentLoc = homeLocation;
                    const optimized = []; const unlocated = []; 
                    
                    dayItems.forEach(item => {
                        const loc = getCustomerLocation(item.id);
                        if (loc) optimized.push({ ...item, _loc: loc }); else unlocated.push(item);
                    });

                    const finalOptimized = [];
                    while (optimized.length > 0) {
                        optimized.sort((a, b) => getDistanceFromLatLonInKm(currentLoc.lat, currentLoc.lng, a._loc.lat, a._loc.lng) - getDistanceFromLatLonInKm(currentLoc.lat, currentLoc.lng, b._loc.lat, b._loc.lng));
                        const nearest = optimized.shift();
                        finalOptimized.push(nearest); currentLoc = nearest._loc; 
                    }
                    finalOptimized.forEach(item => delete item._loc);

                    newSchedule[week][day].items = [...finalOptimized, ...unlocated];
                    setFullMonthSchedule(newSchedule);
                    setStatus({ type: 'success', text: `Đã tự động tối ưu!` });
                }, 300);
            };

            const buildSingleWeek = (isOddWeek) => {
                const activeSubGroup = isOddWeek ? 1 : 2;
                const activeCustomers = customers.filter(c => c.type === 'TRONG_DIEM' || c.subGroup === activeSubGroup).map(c => ({...c, sales: ''}));
                
                const normalize = (str) => str ? str.toLowerCase().replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,"a").replace(/[èéẹẻẽêềếệểễ]/g,"e").replace(/[ìíịỉĩ]/g,"i").replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,"o").replace(/[ùúụủũưừứựửữ]/g,"u").replace(/[ỳýỵỷỹ]/g,"y").replace(/đ/g,"d").trim() : "";

                const grouped = { 'Cái Bè': [], 'Cai Lậy': [], 'Tân Phước': [], 'Châu Thành': [], 'Mỹ Tho': [], 'Khác': [] };
                activeCustomers.forEach(c => {
                    const h = normalize(c.huyen);
                    if (h.includes('be')) grouped['Cái Bè'].push(c);
                    else if (h.includes('lay')) grouped['Cai Lậy'].push(c);
                    else if (h.includes('phuoc')) grouped['Tân Phước'].push(c);
                    else if (h.includes('chau') || h.includes('thanh')) grouped['Châu Thành'].push(c);
                    else if (h.includes('tho')) grouped['Mỹ Tho'].push(c);
                    else grouped['Khác'].push(c);
                });

                const pull = (arr, count) => arr.splice(0, count);

                const weekSchedule = {
                    T2: { day: 'Thứ 2', desc: 'Triển khai tuyến Cai Lậy / Tân Phước', location: 'Cai Lậy / Tân Phước', limit: 12, items: [] },
                    T3: { day: 'Thứ 3', desc: 'Trọng điểm Cái Bè (Thúc đẩy doanh số)', location: 'Cái Bè', limit: 12, items: [] },
                    T4: { day: 'Thứ 4', desc: 'Triển khai tuyến Châu Thành / Mỹ Tho', location: 'Châu Thành / Mỹ Tho', limit: 12, items: [] },
                    T5: { day: 'Thứ 5', desc: 'Triển khai tuyến Cai Lậy / Tân Phước', location: 'Cai Lậy / Tân Phước', limit: 12, items: [] },
                    T6: { day: 'Thứ 6', desc: 'Trọng điểm Cái Bè (Thúc đẩy doanh số)', location: 'Cái Bè / Cai Lậy', limit: 12, items: [] },
                    T7: { day: 'Thứ 7', desc: 'Bảo trì tuyến Mỹ Tho / Châu Thành', location: 'Mỹ Tho / Châu Thành', limit: 10, items: [] },
                };

                weekSchedule.T3.items.push(...pull(grouped['Cái Bè'], 11)); if(weekSchedule.T3.items.length < 10) weekSchedule.T3.items.push(...pull(grouped['Cai Lậy'], 10 - weekSchedule.T3.items.length));
                weekSchedule.T6.items.push(...pull(grouped['Cái Bè'], 11)); if(weekSchedule.T6.items.length < 10) weekSchedule.T6.items.push(...pull(grouped['Cai Lậy'], 10 - weekSchedule.T6.items.length));
                weekSchedule.T2.items.push(...pull(grouped['Cai Lậy'], 7)); weekSchedule.T2.items.push(...pull(grouped['Tân Phước'], 4));
                weekSchedule.T5.items.push(...pull(grouped['Cai Lậy'], 7)); weekSchedule.T5.items.push(...pull(grouped['Tân Phước'], 4));
                weekSchedule.T4.items.push(...pull(grouped['Châu Thành'], 7)); weekSchedule.T4.items.push(...pull(grouped['Mỹ Tho'], 4));
                weekSchedule.T7.items.push(...pull(grouped['Mỹ Tho'], 6)); weekSchedule.T7.items.push(...pull(grouped['Châu Thành'], 4));

                const leftovers = [...grouped['Mỹ Tho'], ...grouped['Châu Thành'], ...grouped['Tân Phước'], ...grouped['Cai Lậy'], ...grouped['Cái Bè'], ...grouped['Khác']];
                const days = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7']; let dayIdx = 0;
                while (leftovers.length > 0) {
                    let placed = false;
                    for (let i = 0; i < days.length; i++) {
                        const d = days[(dayIdx + i) % days.length];
                        if (weekSchedule[d].items.length < weekSchedule[d].limit) { weekSchedule[d].items.push(leftovers.shift()); placed = true; dayIdx = (dayIdx + i + 1) % days.length; break; }
                    }
                    if (!placed && leftovers.length > 0) {
                        let minDay = days[0]; for (let d of days) if (weekSchedule[d].items.length < weekSchedule[minDay].items.length) minDay = d;
                        weekSchedule[minDay].items.push(leftovers.shift());
                    }
                }
                return weekSchedule;
            };

            const executeRoutingForMonth = () => {
                setStatus({ type: 'loading', text: 'Đang tổng hợp lộ trình...' });
                setTimeout(() => {
                    setFullMonthSchedule({ 1: buildSingleWeek(true), 2: buildSingleWeek(false), 3: buildSingleWeek(true), 4: buildSingleWeek(false) });
                    setActiveTab('schedule'); setActiveWeekTab(1); setSearchTerm('');
                    setStatus({ type: 'success', text: `Tạo lộ trình Tháng ${selectedMonth}/${selectedYear} thành công.` });
                }, 500);
            };

            // KẾT XUẤT EXCEL 
            const exportToExcelReal = async () => {
                if (!fullMonthSchedule || !window.ExcelJS) return setStatus({ type: 'error', text: 'Lỗi thư viện xuất Excel.' });
                setStatus({ type: 'loading', text: 'Đang kết xuất báo cáo...' });
                
                try {
                    const wb = new window.ExcelJS.Workbook();
                    wb.creator = 'Routing System';

                    // --- SHEET 1: DOANH SỐ SALE OUT (HIỂN THỊ CỘT NGÀY & DÒNG TỔNG CỘNG) ---
                    const wsForm = wb.addWorksheet('DOANH SỐ SALE OUT', { views: [{ state: 'frozen', ySplit: 8 }] });
                    
                    const columns = [
                        { width: 5 }, { width: 35 }, { width: 15 }, { width: 20 }, { width: 15 }, 
                        { width: 15 }, { width: 20 }, { width: 15 }
                    ];
                    for(let i=1; i<=31; i++) columns.push({ width: 12 }); // 31 cột ngày
                    wsForm.columns = columns;

                    wsForm.mergeCells('D2:K2');
                    wsForm.getCell('D2').value = `BẢNG THEO DÕI DOANH SỐ KHÁCH HÀNG THÁNG ${selectedMonth}.${selectedYear}`;
                    wsForm.getCell('D2').font = { bold: true, size: 14 };

                    wsForm.mergeCells('D3:F3'); wsForm.getCell('D3').value = 'NVKD : .....................';
                    wsForm.mergeCells('D4:F4'); wsForm.getCell('D4').value = `CHỈ TIÊU QUÝ ${Math.ceil(selectedMonth / 3)}`; 
                    wsForm.getCell('G4').value = targetQuarter; wsForm.getCell('G4').numFmt = '#,##0';
                    wsForm.mergeCells('D5:F5'); wsForm.getCell('D5').value = 'THỰC HIỆN:'; 
                    wsForm.mergeCells('D6:F6'); wsForm.getCell('D6').value = 'TỈ LỆ % :'; 
                    wsForm.getCell('G6').value = { formula: 'G5/G4' }; wsForm.getCell('G6').numFmt = '0.00%';

                    // Headers
                    const headerRow = wsForm.getRow(8);
                    const headerValues = ['STT', 'TÊN KHÁCH HÀNG', 'SĐT', 'XÃ', 'HUYỆN', 'TỈNH', 'TÊN NPP', `DS TỔNG THÁNG ${selectedMonth}`];
                    for(let i=1; i<=31; i++) headerValues.push(`Ngày ${i}`);
                    headerRow.values = headerValues;
                    
                    headerRow.eachCell((cell) => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0047AB' } };
                        cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
                        cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                    });

                    // Tính doanh số phân bổ theo ngày
                    const salesMap = {};
                    customers.forEach(c => salesMap[c.id] = { c, days: Array(31).fill(0) });

                    let dayCounter = 0; 
                    [1, 2, 3, 4].forEach(week => {
                        ['T2', 'T3', 'T4', 'T5', 'T6', 'T7'].forEach(dayKey => {
                            if (fullMonthSchedule[week][dayKey]) {
                                fullMonthSchedule[week][dayKey].items.forEach(item => {
                                    if (item.sales && !isNaN(item.sales)) {
                                        salesMap[item.id].days[dayCounter] += Number(item.sales);
                                    }
                                });
                                dayCounter++;
                            }
                        });
                    });

                    let rowIndex = 9;
                    let stt = 1;
                    Object.values(salesMap).forEach((data) => {
                        const r = wsForm.getRow(rowIndex);
                        r.getCell(1).value = stt++;
                        r.getCell(2).value = data.c.name;
                        r.getCell(3).value = data.c.phone;
                        r.getCell(4).value = data.c.xa;
                        r.getCell(5).value = data.c.huyen;
                        r.getCell(6).value = '';
                        r.getCell(7).value = '';
                        
                        r.getCell(8).value = { formula: `SUM(I${rowIndex}:AM${rowIndex})` };
                        r.getCell(8).numFmt = '#,##0'; r.getCell(8).font = { bold: true, color: { argb: 'FF0047AB' } };
                        
                        data.days.forEach((val, idx) => {
                            if (val > 0) {
                                r.getCell(9 + idx).value = val;
                                r.getCell(9 + idx).numFmt = '#,##0';
                            }
                        });

                        r.eachCell({ includeEmpty: true }, (c, colNum) => { if(colNum <= 39) c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} }});
                        rowIndex++;
                    });

                    // THÊM DÒNG TỔNG CỘNG THEO YÊU CẦU
                    const totalRow = wsForm.getRow(rowIndex);
                    totalRow.getCell(2).value = 'TỔNG CỘNG';
                    totalRow.getCell(2).font = { bold: true, color: { argb: 'FFFF0000' } };
                    
                    // Tổng nguyên tháng (Cột H)
                    totalRow.getCell(8).value = { formula: `SUM(H9:H${rowIndex-1})` };
                    totalRow.getCell(8).numFmt = '#,##0'; 
                    totalRow.getCell(8).font = { bold: true, color: { argb: 'FFFF0000' } };

                    // Tổng cho từng ngày (Cột I -> AM)
                    for(let i=1; i<=31; i++) {
                        const colLetter = wsForm.getColumn(8 + i).letter;
                        totalRow.getCell(8 + i).value = { formula: `SUM(${colLetter}9:${colLetter}${rowIndex-1})` };
                        totalRow.getCell(8 + i).numFmt = '#,##0';
                        totalRow.getCell(8 + i).font = { bold: true, color: { argb: 'FFFF0000' } };
                    }
                    
                    totalRow.eachCell({ includeEmpty: true }, (c, colNum) => { 
                        if(colNum <= 39) {
                            c.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } }; // Highlight màu vàng
                        }
                    });

                    wsForm.getCell('G5').value = { formula: `SUM(H9:H${rowIndex-1})` };

                    // --- SHEET 2: LỊCH CHI TIẾT TỪNG NGÀY ---

                        { header: 'NĂM', key: 'year', width: 8 },

                        { header: 'TUẦN', key: 'week', width: 10 },

                        { header: 'HUYỆN/THỊ', key: 'huyen', width: 20 },
                        { header: 'PHÂN LOẠI', key: 'type', width: 15 },
                        { header: 'DOANH SỐ', key: 'sales', width: 18 }

                                    sales: c.sales && !isNaN(c.sales) ? Number(c.sales) : 0

                                    cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };

                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 animate-in fade-in zoom-in-95 duration-200" key={activeWeekTab}>
                                    {Object.entries(fullMonthSchedule[activeWeekTab]).map(([key, data]) => {
                                        const count = data.items.length;
                                        const displayedItems = data.items.filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()));
                                        
                                        let kpiColor = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                                        if (count < 8) kpiColor = 'bg-red-100 text-red-700 border-red-200';

                                        return (
                                            <div key={key} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col">
                                                <div className="bg-slate-50 p-4 border-b border-slate-200">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <h3 className="font-black text-slate-800 text-xl">{data.day}</h3>
                                                        <div className={`px-2.5 py-1.5 text-[11px] font-bold rounded-md border ${kpiColor}`}>{count}/12 Đại lý</div>
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <div className="text-[11px] text-orange-700 flex items-center gap-1.5 font-bold bg-orange-100 px-2 py-1 rounded-md border border-orange-200 w-max">
                                                            <i className="fa-solid fa-truck text-[14px]"></i> {data.desc}
                                                        </div>
                                                        <button onClick={() => handleOptimizeRoute(activeWeekTab, key)} className="text-[10px] bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-2 py-1 rounded font-bold transition">
                                                            <i className="fa-solid fa-route"></i> Tối Ưu Lộ Trình
                                                        </button>
                                                    </div>
                                                </div>
                                                
                                                <div className="p-3 flex-grow overflow-y-auto max-h-[450px] bg-slate-50/50 custom-scrollbar relative">
                                                    {displayedItems.length === 0 ? (
                                                        <div className="text-center text-slate-400 text-sm py-8 font-medium">Không tìm thấy khách hàng.</div>
                                                    ) : (
                                                        <ul className="space-y-3 pb-6">
                                                            {displayedItems.map((c, index) => {
                                                                const loc = getCustomerLocation(c.id);
                                                                const distance = loc && homeLocation ? getDistanceFromLatLonInKm(homeLocation.lat, homeLocation.lng, loc.lat, loc.lng) : '--';
                                                                
                                                                return (
                                                                <li key={c.id} className={`bg-white p-3.5 rounded-xl border flex flex-col gap-2.5 shadow-sm transition-colors relative ${searchTerm ? 'border-blue-400 bg-blue-50/30' : 'border-slate-200 hover:border-blue-300'}`}>
                                                                    <div className="absolute -left-2 -top-2 bg-slate-800 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold shadow">{index + 1}</div>
                                                                    <div className="flex justify-between items-start ml-2">
                                                                        <div className="flex-1 min-w-0">
                                                                            <div className="font-bold text-slate-800 text-[14px] truncate">{c.name}</div>
                                                                            <div className="text-[11px] text-slate-500 mt-0.5 font-medium">{c.xa}, {c.huyen}</div>
                                                                        </div>
                                                                        <span className={`shrink-0 text-[9px] uppercase font-bold px-1.5 py-0.5 rounded border ${c.type === 'TRONG_DIEM' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>
                                                                            {c.type === 'TRONG_DIEM' ? 'Trọng điểm' : 'Duy trì'}
                                                                        </span>
                                                                    </div>

                                                                    <div className="flex flex-col gap-2 border-t border-slate-100 pt-2 ml-2">
                                                                        <div className="flex items-center gap-2">
                                                                            <i className="fa-solid fa-sack-dollar text-green-600 w-4 text-center"></i>
                                                                            <input type="number" placeholder="Nhập doanh số bán (VNĐ)..." value={c.sales || ''} onChange={(e) => handleSalesChange(activeWeekTab, key, c.id, e.target.value)} className="text-xs font-bold text-green-700 border border-slate-200 bg-slate-50 rounded px-2 py-1.5 flex-1 outline-none focus:border-green-500 focus:bg-white transition" />
                                                                        </div>

                                                                        <div className="flex items-center justify-between mt-1">
                                                                            <div className="flex items-center gap-2 text-xs">
                                                                                <i className="fa-solid fa-map-location-dot text-orange-500 w-4 text-center"></i>
                                                                                {loc ? (
                                                                                    <span className="text-slate-600 font-medium text-[11px]">Cách nhà: <span className="text-orange-600 font-bold">{distance} km</span></span>
                                                                                ) : (
                                                                                    <span className="text-slate-400 italic text-[11px]">Chưa có tọa độ</span>
                                                                                )}
                                                                            </div>
                                                                            <div className="flex gap-1.5">
                                                                                <button onClick={() => handleSetCustomerLocation(c.id)} className="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border border-slate-200 font-bold transition">{loc ? 'Cập nhật' : 'Định vị GPS'}</button>
                                                                                {loc && <button onClick={() => handleRemoveCustomerLocation(c.id)} className="text-[10px] bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded border border-red-100 font-bold transition">Xóa</button>}
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </li>
                                                                );
                                                            })}
                                                        </ul>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                    <style dangerouslySetInnerHTML={{__html: `
                        .custom-scrollbar::-webkit-scrollbar { width: 5px; } .custom-scrollbar::-webkit-scrollbar-track { background: transparent; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; } .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
                        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
                    `}} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
